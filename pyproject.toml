[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actinn-jax"
# Single source of truth: actinn_jax.__version__ (see [tool.setuptools.dynamic] below). A
# literal here silently won the build while __init__.py said 0.3.0, so an installed package
# would have reported a version the index had never seen.
dynamic = ["version"]
description = "Fast JAX reimplementation of ACTINN for single-cell cell-type reference mapping"
readme = "README.md"
authors = [
    {name = "Ian Driver", email = "driver.ian@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["single-cell", "cell-type-annotation", "ACTINN", "jax", "scanpy"]
requires-python = ">=3.10"
# Floors matter more than they look. With `scanpy>=1.8` and `numpy>=1.15`, uv took the
# newest numpy and then *degraded scanpy to 1.9.8* to satisfy its numpy cap -- and 1.9.8
# pulls numba 0.53 / llvmlite 0.36, which do not build on Python 3.12, so `uv pip install
# actinn-jax` failed outright (pip happened to backtrack the other way and worked). Raising
# the scanpy floor makes the ancient release ineligible, so a resolver adjusts numpy
# instead. Inherited floors from the original ACTINN were the real problem: they predate
# every version this code has ever run on.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "anndata>=0.9",
    "pandas>=1.5",
    "h5py",
    "scanpy>=1.10",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.5",
]

[project.scripts]
actinn-jax = "actinn_jax.cli:main"

[project.optional-dependencies]
metal = ["jax-metal"]
test = ["pytest"]
# Everything needed to run the example notebooks in examples/ (leidenalg/igraph
# also enable the auto-clustering path of detect_novel_celltypes).
notebooks = ["jupyterlab", "ipykernel", "matplotlib", "pronto", "leidenalg", "igraph"]

[tool.setuptools.dynamic]
version = {attr = "actinn_jax.__version__"}

[tool.setuptools]
packages = ["actinn_jax"]
zip-safe = false
# Defaults to true under pyproject.toml, which sweeps every file in the package directory
# into the wheel and silently re-adds the large references. package-data below is the
# whole point, so it has to be the only source.
include-package-data = false

[tool.setuptools.package-data]
# Only the smallest reference ships in the wheel. All of them together build a 110 MB
# wheel, over PyPI's 100 MB per-file limit, and every new reference makes it worse -- the
# rest download on first use and are cached (actinn_jax/registry.py). panhuman_distill_v1
# is the choice because it is 16 MB and the most accurate general-purpose human reference,
# so `pip install actinn-jax` annotates human data offline with nothing to fetch.
actinn_jax = ["*", "references/README.md",
              "references/panhuman_distill_v1/*.npz",
              "references/panhuman_distill_v1/*.json"]
